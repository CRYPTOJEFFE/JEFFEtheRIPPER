[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jeffe-ultimate"
version = "0.1.0"
description = "Offline recovery workbench with an authenticated single-team server"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
dependencies = []

[project.scripts]
jeffe = "jeffe.cli:main"

[tool.setuptools.packages.find]
include = ["jeffe*"]

[tool.setuptools.package-data]
jeffe = ["data/*.json"]
